<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
  <title>Verification loop recovering eight clauses a single pass reported as missing</title>

  <rect width="960" height="690" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="960" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="960" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="41" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#28c840"/>
  <text x="480" y="21" font-size="11.5" fill="#8b949e" text-anchor="middle">ldd audit — verification loop</text>

  <g font-size="12.5">
    <text x="20" y="62" fill="#7ee787">$ <tspan fill="#c9d1d9">uv run ldd audit agent/evals/golden/build/msa_buried.pdf --simulate --verbose</tspan></text>

    <rect x="20" y="76" width="124" height="18" rx="3" fill="#d29922"/>
    <text x="27" y="89" font-size="11.5" font-weight="700" fill="#0d1117">SIMULATED RUN</text>
    <text x="152" y="89" font-size="11.5" fill="#8b949e">no model calls; agents are deterministic stand-ins.</text>

    <text x="20" y="122" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(Definition of Confidential Information)</tspan></text>
    <text x="20" y="140" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(Permitted Disclosures Carve-Out)</tspan></text>
    <text x="20" y="158" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(Term and Survival)</tspan></text>
    <text x="20" y="176" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(Return or Destruction of Materials)</tspan></text>
    <text x="20" y="194" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(Governing Law and Jurisdiction)</tspan></text>
    <text x="20" y="212" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(Cap on Damages)</tspan></text>
    <text x="20" y="230" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(Injunctive Relief)</tspan></text>
    <text x="20" y="248" fill="#58a6ff">INFO <tspan fill="#8b949e">agent.verifier:</tspan> <tspan fill="#f0883e">Verifier OVERTURNED</tspan> <tspan fill="#c9d1d9">(No License Granted)</tspan></text>

    <text x="20" y="286" fill="#3fb950">┌────────────────────────── Audit complete ──────────────────────────┐</text>
    <text x="20" y="304" fill="#3fb950">│ <tspan fill="#c9d1d9">MSA_BURIED  ·  msa_buried.pdf  ·  4 pages  ·  8 rules            </tspan> │</text>
    <text x="20" y="322" fill="#3fb950">│ <tspan fill="#c9d1d9">Risk score: </tspan><tspan fill="#3fb950">0.0/100</tspan><tspan fill="#c9d1d9">   Confirmed gaps: 0   Verifier overturns: </tspan><tspan fill="#f0883e" font-weight="700">8</tspan><tspan fill="#c9d1d9">  </tspan> │</text>
    <text x="20" y="340" fill="#3fb950">└────────────────────────────────────────────────────────────────────┘</text>

    <text x="20" y="378" fill="#8b949e">┌─────────┬──────────────────────────────┬─────────┬──────────┬───────────────┐</text>
    <text x="20" y="396" fill="#8b949e">│ <tspan fill="#c9d1d9" font-weight="700">Rule   </tspan> │ <tspan fill="#c9d1d9" font-weight="700">Clause                      </tspan> │ <tspan fill="#c9d1d9" font-weight="700">Status </tspan> │ <tspan fill="#c9d1d9" font-weight="700">Severity</tspan> │ <tspan fill="#c9d1d9" font-weight="700">Location     </tspan> │</text>
    <text x="20" y="414" fill="#8b949e">├─────────┼──────────────────────────────┼─────────┼──────────┼───────────────┤</text>
    <text x="20" y="432" fill="#8b949e">│ <tspan fill="#6e7681">NDA-001</tspan> │ <tspan fill="#c9d1d9">Definition of Confidential  </tspan> │ <tspan fill="#3fb950">present</tspan> │ critical │ <tspan fill="#c9d1d9">§7,  p.2 ¶3  </tspan> │</text>
    <text x="20" y="450" fill="#8b949e">│ <tspan fill="#6e7681">NDA-004</tspan> │ <tspan fill="#c9d1d9">Return or Destruction       </tspan> │ <tspan fill="#3fb950">present</tspan> │ medium   │ <tspan fill="#c9d1d9">§12, p.3 ¶3  </tspan> │</text>
    <text x="20" y="468" fill="#8b949e">│ <tspan fill="#6e7681">NDA-006</tspan> │ <tspan fill="#c9d1d9">Cap on Damages              </tspan> │ <tspan fill="#3fb950">present</tspan> │ critical │ <tspan fill="#c9d1d9">§18, p.4 ¶7  </tspan> │</text>
    <text x="20" y="486" fill="#8b949e">│ <tspan fill="#6e7681">NDA-007</tspan> │ <tspan fill="#c9d1d9">Injunctive Relief           </tspan> │ <tspan fill="#3fb950">present</tspan> │ medium   │ <tspan fill="#c9d1d9">§18, p.4 ¶8  </tspan> │</text>
    <text x="20" y="504" fill="#8b949e">└─────────┴──────────────────────────────┴─────────┴──────────┴───────────────┘</text>

    <text x="20" y="540" fill="#f0883e">The verifier overturned 8 finding(s) that a single-pass review would have</text>
    <text x="20" y="558" fill="#f0883e">reported as missing.</text>
  </g>

  <!-- Annotation -->
  <rect x="20" y="580" width="920" height="92" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="36" y="604" font-size="12.5" font-weight="700" fill="#f0883e">What just happened</text>
  <text x="36" y="626" font-size="12" fill="#8b949e">A worker matching on clause names found nothing and reported all eight obligations missing. The cap on</text>
  <text x="36" y="644" font-size="12" fill="#8b949e">damages is real — it sits in §18 "Miscellaneous", worded "shall not exceed the charges paid", sharing no</text>
  <text x="36" y="662" font-size="12" fill="#8b949e">vocabulary with "Cap on Damages". Whole-document synonym retrieval found it. Eight overturns, all correct.</text>
</svg>
