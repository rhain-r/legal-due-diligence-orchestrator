  - rule_id: NDA-003
    expected: present
    location: "§11"
    note: Five-year term, seven-year survival of clause 7.
  - rule_id: NDA-004
    expected: present
    location: "§12"
    note: Under "Consequences of Termination", not a return-of-materials heading.
  - rule_id: NDA-005
    expected: present
    location: "§15"
  - rule_id: NDA-006
    expected: present
    location: "§18"
    note: >-
      Cap is the first paragraph of Miscellaneous, after a carve-out for fraud
