title: Master services agreement, protections buried in Miscellaneous
purpose: >-
  The retrieval test. Every obligation exists, but they are scattered across a
  four-page commercial agreement and two of them live in clause 18,
  "Miscellaneous" — exactly where standard protections end up in practice and
  exactly where a scoped reviewer never looks.

