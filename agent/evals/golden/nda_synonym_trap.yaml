contract_id: NDA-SYNONYM-TRAP
source: nda_synonym_trap
title: Topic discussed everywhere, obligation created nowhere
purpose: >-
  The keyword trap, aimed squarely at the verifier. The recitals name return of
  materials and injunctive relief; two sections carry those exact headings. None
  of it creates an obligation. A verifier that overturns on keyword proximity
  fails here, which is the point — synonym retrieval must find the clause, and
  then something must still judge whether the language is operative.

